# LeRobot policy server for the fine-tuned SmolVLA (runs on the RunPod GPU, see runpod/serve.sh).
# The laptop connects through an SSH tunnel (scripts/tunnel.bat), so the server only listens on
# localhost inside the pod and no extra port has to be exposed.
deployment: blocks_into_box
model:
  repo_or_path: JRrobots4all/smolvla_so101_blocks_into_box
  revision: null
  device: cuda
execution:
  supported_modes: [chunk]
  action_fps: 30.0
  action_deadline_s: 5.0
  idle_timeout_s: 10.0
  warmup_calls: 2
language:
  enabled: false
  deadline_s: 60.0
zenoh:
  mode: peer
  listen_endpoints: [tcp/127.0.0.1:7447]
# The dataset was recorded with the default so101_follower settings: joints in degrees,
# gripper 0-100 %.
semantics: so101-degrees-gripper-percent-v1
robot_type: so_follower
# Checkpoint-facing names: the laptop renames top -> camera1 and side -> camera2 (RENAME_MAP).
features:
  - name: observation.state
    shape: [6]
    dtype: float32
    names: [shoulder_pan.pos, shoulder_lift.pos, elbow_flex.pos, wrist_flex.pos, wrist_roll.pos, gripper.pos]
    semantics: so101-degrees-gripper-percent-v1
  - name: observation.images.camera1
    shape: [480, 640, 3]
    dtype: uint8
    kind: rgb
    semantics: rgb-top-table-v1
  - name: observation.images.camera2
    shape: [480, 640, 3]
    dtype: uint8
    kind: rgb
    semantics: rgb-side-table-v1
action_feature:
  name: action
  shape: [6]
  dtype: float32
  names: [shoulder_pan.pos, shoulder_lift.pos, elbow_flex.pos, wrist_flex.pos, wrist_roll.pos, gripper.pos]
  semantics: so101-degrees-gripper-percent-v1
